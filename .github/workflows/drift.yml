name: Drift

# Out of band, on purpose. A drift check NEVER fails a call that is working —
# see src/drift.ts. It runs here so that a provider changing its API is
# something we are told, rather than something a consumer discovers.
#
# It also runs the credential-free probes, which need a network and nothing
# else. Offline is reported as SKIPPED; a probe suite that goes red when GitHub
# has a bad afternoon is a suite people learn to ignore.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Probe the real APIs with invalid credentials
        run: npm run probe

      - name: Check declared contracts against published specs
        run: npm run drift
