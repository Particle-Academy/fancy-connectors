name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      # Failing here is cheap, and the same check gates the release — so a PR
      # that adds an unapproved or abandoned dependency finds out now.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # Until the core is published, resolve it from the sibling checkout. After
      # that this step is how a core change is proven against the catalogue
      # BEFORE it ships -- which is the case that actually recurs, since the two
      # repositories release on separate clocks.
      - name: Link the sibling core, if this workspace has one
        run: node scripts/link-core.mjs || echo "no sibling checkout; using the installed core"

      - name: Lint
        run: npm run lint

      # NOT `npm test --if-present`. A green tick over an absent suite is worse
      # than a red one, and this package's whole argument is about claims that
      # outrun the code.
      - name: Test
        run: npm test

